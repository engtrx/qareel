name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unpack project
        run: unzip -o qareeb-project.zip
        
      - name: Fix Architecture Automatically
        run: |
          # البحث عن ملف build.gradle داخل مجلد app أينما كان
          BUILD_FILE=$(find . -name "build.gradle" -path "*/app/*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            echo "تم العثور على الملف في: $BUILD_FILE"
            sed -i "/defaultConfig {/a \        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }" "$BUILD_FILE"
            echo "تمت إضافة دعم المعالجات بنجاح."
          else
            echo "لم يتم العثور على ملف build.gradle"
          fi
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Build
        run: |
          # البحث عن مكان gradlew والدخول إليه للبناء
          PROJECT_DIR=$(dirname "$(find . -name gradlew -type f | head -n 1)")
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon
          
      - name: Copy APK to root
        run: |
          # نسخ ملف APK إلى المجلد الرئيسي لسهولة رفعه
          find . -name "app-debug.apk" -exec cp {} ./app-debug.apk \;
          
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: قريب v${{ github.run_number }}
          files: app-debug.apk
